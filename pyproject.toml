[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-tool"
version = "1.0.0"
description = "VPN Gateway Manager command-line tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0"
]

[project.scripts]
vpn-tool = "vpn_tool.main:main"
vpn = "vpn_tool.main:main"

[tool.setuptools.packages.find]
include = ["vpn_tool*"]
